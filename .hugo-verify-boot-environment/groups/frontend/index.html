    };

    function shuffledDeck(values) {
        const deck = [...new Set(values.filter(Boolean))];
        for (let i = deck.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [deck[i], deck[j]] = [deck[j], deck[i]];
        }
        return deck;
    }

    function randomizeUnique(selector, images) {
        const deck = shuffledDeck(images);
        document.querySelectorAll(selector).forEach((img, index) => {
            if (index < deck.length) {
                img.src = deck[index];
            }
        });
    }

    randomizeUnique(".js-random-secondary-cover", pools.secondary);
    randomizeUnique(".js-random-group-index-avatar", pools.secondary);
    randomizeUnique(".js-random-module-icon", pools.modules);
})();

document.querySelectorAll("[data-module-tabs]").forEach((tabs) => {
    const buttons = Array.from(tabs.querySelectorAll("[data-tab-target]"));
    const panels = Array.from(tabs.querySelectorAll(".module-tab-panel"));

    buttons.forEach((button) => {
        button.addEventListener("click", () => {
            const targetId = button.dataset.tabTarget;

            buttons.forEach((item) => {
                const isActive = item === button;
                item.classList.toggle("is-active", isActive);
                item.setAttribute("aria-selected", String(isActive));
            });

            panels.forEach((panel) => {
                panel.classList.toggle("is-active", panel.id === targetId);
            });
        });
    });
});

    snow.className = "snow";
    snow.style.left = Math.random() * 100 + "vw";
    snow.style.animationDuration = 10 + Math.random() * 8 + "s";
    snow.style.opacity = Math.random();
    snow.style.transform = `scale(${Math.random()})`;
    document.body.appendChild(snow);
}
</script>
