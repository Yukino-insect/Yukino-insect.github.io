<script>
 
const hero = document.getElementById("hero");
const images = ["/images/cover/cover1.jpg","/images/cover/cover2.jpg","/images/cover/cover4.jpg","/images/cover/cover5.jpg","/images/cover/cover6.jpg","/images/cover/cover10.jpg","/images/cover/cover11.jpg","/images/cover/cover12.jpg","/images/cover/cover17.jpg","/images/cover/cover18.jpg","/images/cover/cover19.jpg","/images/cover/cover20.jpg","/images/cover/cover21.jpg"];

function shuffledDeck(values) {
    const deck = [...new Set(values.filter(Boolean))];
    for (let i = deck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [deck[i], deck[j]] = [deck[j], deck[i]];
    }
    return deck;
}

let deck = shuffledDeck(images);
let current = 0;
if (deck.length) {
    hero.style.backgroundImage = `url('${deck[current]}')`;
}

hero.onclick = () => {
    if (deck.length <= 1) return;
    current = (current + 1) % deck.length;
    if (current === 0) {
        deck = shuffledDeck(images);
    }
    hero.style.backgroundImage = `url('${deck[current]}')`;
};

 
for (let i = 0; i < 35; i++) {
    const snow = document.createElement("div");
    snow.className = "snow";
    snow.style.left = Math.random() * 100 + "vw";
    snow.style.animationDuration = 8 + Math.random() * 8 + "s";
    snow.style.opacity = Math.random();
    snow.style.transform = `scale(${Math.random()})`;
    document.body.appendChild(snow);
}
</script>
