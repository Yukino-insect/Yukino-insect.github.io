<style>
 
header, footer {
    display: none !important;
}

body {
    margin: 0;
    overflow-x: hidden;
    overflow-y: auto;
    scrollbar-gutter: stable both-edges;

}

.bg {

    inset: 0;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    z-index: 0;
}

 
.bg::before {

    position: absolute;
    inset: 0;
    background:
        linear-gradient(
            180deg,
            rgba(40,50,65,.45) 0%,
            rgba(44,55,68,.42) 70%,
            rgba(132, 160, 188, .24) 90%,
            rgba(116, 146, 176, .42) 100%

}

    z-index: 2;
    max-width: 940px;
    margin: 0 auto;
    padding: 108px 20px 96px;
}

 
.post-list {
    display: grid;
    gap: 18px;
}

.post-card {
    width: min(100%, 720px);
    margin: 0 auto;
}

.post-link {
    position: relative;
    display: grid;
    grid-template-columns: 56px minmax(0, 1fr);
    align-items: center;
    gap: 16px;
    padding: 18px 22px;

    background: linear-gradient(
        to bottom,

    box-shadow:
        inset 0 0 0 1px rgba(210,220,235,.58),

}

    width: 2px;

    background: rgba(255,255,255,0.85);

    box-shadow:

        0 0 6px rgba(180,200,220,0.35);
    pointer-events: none;
    animation: snow-fall linear infinite;
    z-index: 1;
}

@keyframes snow-fall {
    to {
        transform: translateY(110vh);
        opacity: 0;
    }
}

<script>


(function () {
    const images = ["/images/cover/cover1.jpg","/images/cover/cover2.jpg","/images/cover/cover3.jpg","/images/cover/cover4.jpg","/images/cover/cover5.jpg","/images/cover/cover6.jpg","/images/cover/cover7.jpg","/images/cover/cover8.jpg","/images/cover/cover9.jpg","/images/cover/cover10.jpg","/images/cover/cover11.jpg","/images/cover/cover12.jpg","/images/cover/cover13.jpg","/images/cover/cover14.jpg","/images/cover/cover15.jpg","/images/cover/cover16.jpg","/images/cover/cover17.jpg","/images/cover/cover18.jpg","/images/cover/cover19.jpg","/images/cover/cover20.jpg","/images/cover/cover21.jpg"];

    const bg = document.getElementById("pageBg");
    bg.style.backgroundImage =
        `url('${images[Math.floor(Math.random() * images.length)]}')`;
})();

(function () {
    const images = ["/images/avatar/avatar1.jpg","/images/avatar/avatar2.jpg","/images/avatar/avatar3.jpg","/images/avatar/avatar4.jpg","/images/avatar/avatar5.jpg","/images/avatar/avatar6.jpg","/images/avatar/avatar7.jpg","/images/avatar/avatar8.jpg","/images/avatar/avatar9.jpg","/images/avatar/avatar10.jpg","/images/avatar/avatar11.jpg","/images/avatar/avatar12.jpg","/images/avatar/avatar13.jpg","/images/avatar/avatar14.jpg","/images/avatar/avatar15.jpg","/images/avatar/avatar16.jpg","/images/avatar/avatar17.jpg","/images/avatar/avatar18.jpg","/images/avatar/avatar19.jpg","/images/avatar/avatar20.jpg","/images/avatar/avatar21.jpg","/images/avatar/avatar22.jpg","/images/avatar/avatar23.jpg","/images/avatar/avatar24.jpg","/images/avatar/avatar25.jpg","/images/avatar/avatar26.jpg","/images/avatar/avatar27.jpg"];

    function shuffledDeck(values) {
        const deck = [...new Set(values.filter(Boolean))];
        for (let i = deck.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [deck[i], deck[j]] = [deck[j], deck[i]];
        }
        return deck;
    }

    const deck = shuffledDeck(images);
    document.querySelectorAll(".js-random-post-avatar").forEach((img, index) => {
        if (index < deck.length) {
            img.src = deck[index];
        }
    });
})();



for (let i = 0; i < 30; i++) {
    const snow = document.createElement("div");
    snow.className = "snow";
    snow.style.left = Math.random() * 100 + "vw";
    snow.style.animationDuration = 10 + Math.random() * 8 + "s";
    snow.style.opacity = Math.random();
    snow.style.transform = `scale(${Math.random()})`;
    document.body.appendChild(snow);
}
</script>
