groups:
  - slug: computer-basics
    title: 计算机基础
    subtitle: 系统、网络、算法
    lead: 从机器如何运行，到程序如何被调度，再到网络如何把请求送到远方。
    sections:
      - computerorganization
      - algorithm
      - internet
      - linux
    lanes:
      - title: 系统底层
        slug: systems
        summary: 计算机组成、操作系统、进程线程、内存与 I/O。
        modules:
          - title: 组成原理与操作系统
            summary: CPU、进程、线程、内存、磁盘这些不常露面但始终在场的东西。
            sections:
              - computerorganization
          - title: Linux 与 I/O
            summary: 权限、文件描述符、多路复用、性能观察。
            sections:
              - linux
      - title: 算法能力
        slug: algorithms
        summary: 数据结构、排序、查找、字符串与常见题型。
        modules:
          - title: 数据结构与算法
            summary: 用尽量稳定的套路处理不太稳定的问题。
            sections:
              - algorithm
      - title: 网络基础
        slug: network
        summary: DNS、TCP、HTTPS、代理、跨域与浏览器请求行为。
        modules:
          - title: 互联网协议
            summary: 从点击链接到服务返回之间发生的那些事。
            sections:
              - internet

  - slug: java-stack
    title: Java 技术栈
    subtitle: 语言、虚拟机、框架
    lead: Java 基础、JVM、并发、Spring 生态和持久层框架放在一起看，脉络会清楚得多。
    sections:
      - javase
      - javaee
      - jvm
      - juc
      - spring
      - springboot
      - mybatis
    lanes:
      - title: 语言基础
        slug: language
        summary: 类型、集合、异常、反射、IO、NIO 与常用 API。
        modules:
          - title: Java SE
            summary: 语言特性和标准库，写业务代码之前最好先把它们看顺眼。
            sections:
              - javase
          - title: Java EE 与设计思想
            summary: Java 后端语境中的规范、模式与工程化思想。
            sections:
              - javaee
      - title: 运行时与并发
        slug: runtime-concurrency
        summary: JVM 内存、类加载、GC、锁、线程池与并发工具。
        modules:
          - title: JVM
            summary: 对象、类加载、GC、调优，都是运行时给出的答案。
            sections:
              - jvm
          - title: JUC 并发
            summary: 线程协作、锁、AQS、线程池和异步编排。
            sections:
              - juc
      - title: Spring 生态
        slug: spring-ecosystem
        summary: 从 IoC、AOP、MVC 到 Boot、Security、Gateway 与持久层。
        modules:
          - title: Spring Framework
            summary: 容器、Web、事务、安全和扩展点。
            sections:
              - spring
          - title: Spring Boot
            summary: 自动配置、运行时能力与常见工程配置。
            sections:
              - springboot
          - title: MyBatis
            summary: SQL 映射、分页、事务、插件和 MyBatis-Plus。
            sections:
              - mybatis

  - slug: data-search
    title: 数据库与检索
    subtitle: MySQL、Redis、ES
    lead: 把持久化、缓存、索引和数据同步放在同一个入口里，才像一条完整的数据链路。
    sections:
      - mysql
      - redis
      - elasticsearch
    lanes:
      - title: 关系型数据库
        slug: relational-database
        summary: SQL、事务、索引、锁、复制和表结构设计。
        modules:
          - title: MySQL
            summary: 从执行顺序到事务边界，再到索引结构和主从复制。
            sections:
              - mysql
      - title: 缓存系统
        slug: cache
        summary: Redis 数据结构、高可用、复制与常见使用方式。
        modules:
          - title: Redis
            summary: 缓存并不是把数据塞进去就完事，它也有自己的秩序。
            sections:
              - redis
      - title: 搜索与同步
        slug: search-sync
        summary: Elasticsearch 查询、索引、相似搜索和数据同步。
        modules:
          - title: Elasticsearch
            summary: 检索、聚合、同义词、同步方案和并发问题。
            sections:
              - elasticsearch

  - slug: distributed-systems
    title: 分布式架构
    subtitle: 微服务、治理、配置
    lead: 服务拆开以后，真正的问题才刚刚开始。这里放注册配置、熔断降级、事务和系统边界。
    sections:
      - microservices
      - nacos
      - sentinel
    lanes:
      - title: 微服务设计
        slug: microservice-design
        summary: 服务边界、事务一致性、发件箱模式和哈希分布。
        modules:
          - title: 微服务与分布式事务
            summary: 一致性、降级、Outbox、Seata 这些绕不开的工程问题。
            sections:
              - microservices
      - title: 服务治理
        slug: service-governance
        summary: 注册发现、配置中心、灰度、标签路由与控制台运维。
        modules:
          - title: Nacos
            summary: 注册中心、配置中心、Tag 和一致性协议。
            sections:
              - nacos
      - title: 稳定性建设
        slug: stability
        summary: 限流、熔断、降级和系统在压力下的自我保护。
        modules:
          - title: Sentinel
            summary: 把失败限制在合理范围内，也是一种温柔。
            sections:
              - sentinel

  - slug: python
    title: Python
    subtitle: 语言、脚本、工程
    lead: Python 语言机制、日常语法和脚本化能力放在一个入口里，方便以后继续扩展。
    sections:
      - python
    lanes:
      - title: Python 基础
        slug: language
        summary: 语法机制、迭代器、生成器和常用语言特性。
        modules:
          - title: 语言机制
            summary: Python 语法和运行机制相关笔记。
            sections:
              - python

  - slug: git
    title: Git
    subtitle: 版本控制、协作、底层
    lead: Git 命令、暂存区、提交对象和协作流程集中放在这里，查起来会更直接。
    sections:
      - git
    lanes:
      - title: 版本控制
        slug: version-control
        summary: Git 命令、分支、提交对象和日常协作。
        modules:
          - title: Git 基础
            summary: Git 使用方式与底层对象模型。
            sections:
              - git
