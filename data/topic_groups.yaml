groups:
  - slug: computer-basics
    title: 计算机基础
    subtitle: 系统、网络、算法
    lead: 从机器如何运行，到程序如何被调度，再到网络如何把请求送到远方。
    sections:
      - computerorganization
      - algorithm
      - internet
      - linux
      - assembly
      - docker
    lanes:
      - title: 系统底层
        slug: systems
        summary: 计算机组成、操作系统、进程线程、内存与 I/O。
        modules:
          - title: 组成原理与操作系统
            summary: CPU、进程、线程、内存、磁盘这些不常露面但始终在场的东西。
            sections:
              - computerorganization
          - title: Linux 与 I/O
            summary: 权限、文件描述符、多路复用、性能观察。
            sections:
              - linux
          - title: Docker 容器技术教程
            summary: 从容器、镜像与 Compose 入门，到网络存储、构建优化、底层隔离和工程化运维。
            sort: file
            paths:
              - Docker/docker-course/
          - title: RISC-V 汇编与内核启动
            summary: 从寄存器、调用约定和栈，到 xv6 进入第一个 C 函数之前发生的事。
            sort: file
            sections:
              - assembly
      - title: 算法能力
        slug: algorithms
        summary: 数据结构、排序、查找、字符串与常见题型。
        modules:
          - title: 数据结构与算法
            summary: 用尽量稳定的套路处理不太稳定的问题。
            sections:
              - algorithm
      - title: 网络基础
        slug: network
        summary: DNS、TCP、HTTPS、代理、跨域与浏览器请求行为。
        modules:
          - title: 互联网协议
            summary: 从点击链接到服务返回之间发生的那些事。
            sections:
              - internet

  - slug: java-stack
    title: Java
    subtitle: 语言、虚拟机、框架
    lead: Java 基础、JVM、并发、Spring 生态和持久层框架放在一起看，脉络会清楚得多。
    sections:
      - java
      - jvm
      - juc
      - spring
      - mybatis
      - thirdpartylibraries
    lanes:
      - title: Java 基础
        slug: language
        summary: 类型、集合、异常、反射、IO、NIO 与常用 API。
        modules:
          - title: 语言机制与设计思想
            summary: 语言特性和标准库，写业务代码之前最好先把它们看顺眼。
            sections:
              - java
      - title: 运行时与并发
        slug: runtime-concurrency
        summary: JVM 内存、类加载、GC、锁、线程池与并发工具。
        modules:
          - title: JVM
            summary: 对象、类加载、GC、调优，都是运行时给出的答案。
            sections:
              - jvm
          - title: JUC 并发
            summary: 线程协作、锁、AQS、线程池和异步编排。
            sections:
              - juc
      - title: Spring 生态
        slug: spring-ecosystem
        summary: 从 IoC、AOP、MVC 到 Boot、Security、Gateway、持久层和常用三方库。
        modules:
          - title: Spring Framework
            summary: 容器、Web、事务、安全和扩展点。
            sections:
              - spring
          - title: MyBatis
            summary: SQL 映射、分页、事务、插件和 MyBatis-Plus。
            sections:
              - mybatis
          - title: Java 常用三方库
            summary: Shiro、Jackson、Flowable、XXL-JOB、POI、验证码等工程组件。
            sections:
              - thirdpartylibraries

  - slug: data-store-search
    title: 数据存储与检索
    subtitle: 关系库、缓存、检索、对象与分析
    lead: 把持久化、缓存、检索、对象存储与分析系统放在同一个入口里，数据链路才不会只剩产品名。
    sections:
      - mysql
      - redis
      - elasticsearch
      - oss
      - sqlite
    lanes:
      - title: 关系型数据库
        slug: relational-database
        summary: SQL、事务、索引、锁、复制和表结构设计。
        modules:
          - title: MySQL
            summary: 从执行顺序到事务边界，再到索引结构和主从复制。
            sections:
              - mysql
          - title: SQLite
            summary: 认识嵌入式数据库 SQLite 
            sections:
              - sqlite
      - title: 缓存系统
        slug: cache
        summary: Redis 数据结构、高可用、复制与常见使用方式。
        modules:
          - title: Redis
            summary: 缓存并不是把数据塞进去就完事，它也有自己的秩序。
            sections:
              - redis
      - title: 搜索、对象存储与分析
        slug: search-sync
        summary: 搜索与同步、S3 对象存储、向量与图检索，以及 ClickHouse 分析型数据库。
        modules:
          - title: Elasticsearch
            summary: 检索、聚合、同义词、同步方案和并发问题。
            sections:
              - elasticsearch
          - title: OSS 与文件存储
            summary: MinIO、对象存储、文件访问路径和上传下载链路。
            paths:
              - OSS/
            excludePaths:
              - OSS/object-storage-course/
          - title: RustFS、MinIO 与 S3 对象存储实战
            summary: 从对象模型和请求签名，到分片上传、预签名、生命周期、备份恢复与故障排查。
            sort: file
            paths:
              - OSS/object-storage-course/
          - title: 向量数据库与向量检索
            summary: Embedding、ANN、pgvector 与 Milvus 的数据模型、索引参数、压测、迁移与恢复。
            sort: file
            paths:
              - VectorDB/vector-database-course/
          - title: 图数据库、知识图谱与图检索
            summary: Neo4j、Cypher、APOC、GDS、数据摄取、备份恢复；GraphRAG 仅作为一项应用。
            sort: file
            paths:
              - GraphDB/graph-database-course/
          - title: ClickHouse 列式分析数据库
            summary: MergeTree、排序键、分区、批量摄入、系统表、TTL、备份与恢复。
            sort: file
            paths:
              - ClickHouse/clickhouse-course/

  - slug: distributed-systems
    title: 分布式架构
    subtitle: 微服务、治理、协调
    lead: 服务拆开以后，真正的问题才刚刚开始。这里放注册配置、协调一致性、熔断降级、事务和系统边界。
    sections:
      - microservices
      - nacos
      - sentinel
    lanes:
      - title: 微服务设计
        slug: microservice-design
        summary: 服务边界、事务一致性、发件箱模式和哈希分布。
        modules:
          - title: 微服务与分布式事务
            summary: 一致性、降级、Outbox、Seata 这些绕不开的工程问题。
            sections:
              - microservices
      - title: 服务治理与协调
        slug: service-governance
        summary: 注册发现、配置中心、协调元数据、灰度、标签路由与控制台运维。
        modules:
          - title: Nacos
            summary: 注册中心、配置中心、Tag 和一致性协议。
            sections:
              - nacos
          - title: etcd 分布式协调服务
            summary: Raft、MVCC revision、watch、lease、事务、选主、压缩、快照和灾难恢复。
            sort: file
            paths:
              - Microservices/etcd-course/
      - title: 稳定性建设
        slug: stability
        summary: 限流、熔断、降级和系统在压力下的自我保护。
        modules:
          - title: Sentinel
            summary: 把失败限制在合理范围内，也是一种温柔。
            sections:
              - sentinel

  - slug: ai-engineering
    title: AI 工程
    subtitle: RAG、Agent、模型与中间件
    lead: RAG、Agent、模型服务与数据中间件各有自己的运行规律；既要能组合成应用，也不能把它们误会成几个接口调用。
    sections:
      - agent
    lanes:
      - title: RAG 与 Agent
        slug: rag-agent
        summary: 从 RAG 基础、知识库建设、模型调度、问答链路到评测和面试表达。
        modules:
          - title: RAG 与 Agentic AI 工程课程
            summary: 按课程章节组织的系列文章。
            intro:
              title: 课程导读
              path: Agent/ai-course/README.md
            tabs:
              - title: RAG 基础
                path: Agent/ai-course/01-rag-basics/
              - title: 知识库建设
                path: Agent/ai-course/02-knowledge-base/
              - title: 模型调度
                path: Agent/ai-course/03-model-infra/
              - title: 知识问答
                path: Agent/ai-course/04-ai-qa/
              - title: RAG 评测
                path: Agent/ai-course/05-rag-evaluation/
              - title: 面试考点
                path: Agent/ai-course/06-interview/
              - title: Java Agent 框架实战
                path: Agent/ai-course/07-java-agent-runtime/
          - title: LangChain 与 LangGraph
            summary: LangChain、LangGraph、LangSmith、CLI、Server 和 Prompt 工程相关笔记。
            paths:
              - Agent/
            excludePaths:
              - Agent/ai-course/
              - Agent/AgentEngineering/
          - title: Agent 工程核心概念
            summary: 从 Prompt、项目指令与可复用工作流，到外部工具连接和能力分发，建立一套不混淆职责的 Agent 工程认知。
            paths:
              - Agent/AgentEngineering/
      - title: AI 模型服务与可观测性
        slug: ai-middleware
        summary: 模型推理、文档智能与 LLM/Agent 运行治理；数据存储和分布式协调请在各自分类学习。
        modules:
          - title: 深度学习、模型推理与重排序
            summary: Transformer、PyTorch、CPU/GPU、FP16、FastAPI 与 BGE Reranker 的独立模型服务实践。
            sort: file
            paths:
              - Agent/ai-middleware-courses/02-model-inference-and-rerank/
          - title: 文档智能与 OCR
            summary: OCR、版面分析、结构化文档资产、异步任务与解析服务部署。
            sort: file
            paths:
              - Agent/ai-middleware-courses/03-document-intelligence-ocr/
          - title: LLM 可观测性与运行治理
            summary: Langfuse、ClickHouse、Trace、成本、隐私、队列背压与 Compose 运维。
            sort: file
            paths:
              - Agent/ai-middleware-courses/05-llm-observability/


  - slug: random-thoughts
    title: 随笔杂谈
    subtitle: 项目、方案、Git、零散问题
    lead: 零散并不等于无序，只是它们暂时还没有被命名成体系。项目经验、通用中间件和 Git 这类横跨多个主题的内容，放在这里会更合适。
    sections:
      - randomthoughts
      - middleware
      - git
    lanes:
      - title: 零散问题
        slug: fragmented-questions
        summary: 日常项目经验、方案设计、通用中间件、工程问题和一些临时想法。
        modules:
          - title: 胡思乱想
            summary: 项目经验、方案设计、Canal、Nginx、FTP 和其他暂时不必单独成类的工程问题。
            sections:
              - randomthoughts
              - middleware
          - title: 英语
            summary: 介词、介词短语和名词作定语等容易在细节处失分的语法问题。
            sections:
              - english
          - title: 数学
            summary: 从极限、连续到微分，讨论变化如何被精确地描述。
            sections:
              - math
      - title: Git
        slug: git
        summary: Git 命令、分支、提交对象和日常协作。
        modules:
          - title: Git 基础
            summary: Git 使用方式与底层对象模型。
            sections:
              - git
      - title: 日记
        slug: diary
        summary: 记录我的一些日常趣事。
        modules:
          - title: 大学风流
            summary: 大学正好。
            sections:
              - diary

  - slug: frontend
    title: 前端知识
    subtitle: JS/TS、HTML/CSS、Vue、React
    lead: 前端并不只是页面样式，它还包括语言、构建、状态、接口、跨端和工程协作。把这些内容独立出来，学习路径会清楚很多。
    sections:
      - jsandts
      - htmlandcss
      - vue
      - react
    lanes:
      - title: JS/TS 与构建工具
        slug: language-build
        summary: 从 JavaScript 基础、TypeScript 类型系统到 Node.js、包管理器和 Vite 工程化。
        modules:
          - title: JavaScript 从零到业务逻辑
            summary: 运行模型、变量类型、对象数组、函数、异步编程、模块化和浏览器运行时。
            sort: file
            paths:
              - JSAndTS/01-javascript/
          - title: TypeScript 类型系统
            summary: 类型推断、联合类型、类型收窄、泛型、工具类型和工程建模。
            sort: file
            paths:
              - JSAndTS/02-typescript/
          - title: Node 与前端工程化
            summary: Node.js、npm、pnpm、依赖版本、Vite、环境变量、调试、质量门禁和构建部署。
            sort: file
            paths:
              - JSAndTS/03-tooling/
      - title: HTML 和 CSS
        slug: html-css
        summary: 从网页结构、常用标签、表单可访问性，到 CSS 盒模型、布局、响应式和工程化样式组织。
        modules:
          - title: HTML 入门与语义结构
            summary: 网页基本结构、常见标签、语义化、链接、图片、表单和可访问性。
            paths:
              - HtmlAndCSS/01-html-basics/
          - title: CSS 基础与布局
            summary: 选择器、层叠、继承、盒模型、文本颜色、背景、Flex、Grid、定位和层级。
            paths:
              - HtmlAndCSS/02-css-basics/
          - title: 响应式与样式工程
            summary: 移动端适配、响应式布局、CSS 变量、Vue scoped 样式、uni-app 样式和常见问题排查。
            paths:
              - HtmlAndCSS/03-responsive-engineering/
      - title: Vue 与 React
        slug: vue-react
        summary: Vue 3 与 React 的组件模型、状态管理、页面组织、测试、性能和工程实践。
        modules:
          - title: Vue 3 工程实战课程
            summary: 从 Vue 核心语法、响应式、组件通信、Pinia、接口数据流，到路由、测试部署和综合项目实战。
            intro:
              title: 课程导读
              path: Vue/README.md
            tabs:
              - title: Vue 核心
                path: Vue/01-vue-core/
              - title: 状态数据
                path: Vue/02-state-data/
              - title: 工程实践
                path: Vue/03-engineering/
              - title: 综合练习
                path: Vue/04-final-project/
          - title: React 基础与工程实践
            summary: 从声明式 UI、组件、状态和渲染模型出发，建立 React 应用的正确心智模型。
            sort: file
            paths:
              - React/

  - slug: mq
    title: 消息队列
    subtitle: MQ、RocketMQ、Kafka、事件驱动
    lead: 消息队列适合放削峰、异步解耦、延迟处理、重试和事件驱动相关内容。RocketMQ 和 Kafka 的模型差异很明显，分开看会比混在一起诚实得多。
    sections:
      - mq
    lanes:
      - title: RocketMQ
        slug: rocketmq
        summary: RocketMQ 消息模型、生产消费、重试、死信队列和 Spring 集成。
        modules:
          - title: RocketMQ
            summary: 生产者、消费者、消息类型、重试、死信队列和 Spring 集成。
            paths:
              - MQ/RocketMQ
      - title: Kafka
        slug: kafka
        summary: Kafka 分布式日志模型、分区、副本、消费组、事务和 Spring 集成。
        modules:
          - title: Kafka
            summary: Topic、Partition、Broker、ConsumerGroup、可靠性语义和 Spring Kafka。
            paths:
              - MQ/Kafka

  - slug: python
    title: Python
    subtitle: 语言、脚本、工程
    lead: Python 语言机制、日常语法和脚本化能力放在一个入口里，方便以后继续扩展。
    sections:
