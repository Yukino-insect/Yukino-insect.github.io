            summary: 路由、请求方法、生命周期、中间件、静态资源、依赖与接口契约。
            sort: file
            paths:
              - Python/frameworks/fastapi/
          - title: SQLAlchemy ORM
            summary: 从 Engine、Session 与事务，到声明式映射、关系加载与工程化实践。
            sort: file
            paths:
              - Python/frameworks/sqlalchemy/
          - title: PySide6 / Qt 桌面工程专题
            summary: 从事件循环、对象树、信号槽和布局开始，进入模型视图、并发任务、进程通信与可维护桌面应用架构，并以净绘工坊为实战案例。
            sort: file
            paths:
              - Python/qt-desktop-course/

  - slug: c-cpp
    title: C/C++
    subtitle: C、C++、系统编程
    lead: C 和 C++ 适合放语言基础、内存模型、指针、编译链接、标准库和系统编程相关内容。底层问题本来就不该被塞进其他语言分类里假装不存在。
    sections:
      - c&c++
    lanes:
      - title: C/C++ 基础
        slug: language
        summary: C/C++ 语法、内存、指针、编译链接和标准库。
        modules:
          - title: 语言与运行模型
            summary: 语言基础、内存管理、指针引用、编译链接和常用标准库。
            paths:
              - C&C++/
            excludePaths:
              - C&C++/stl/
          - title: C++ STL 常用用法
            summary: 从 vector、unordered_map 和迭代器入门，再认识常用算法的职责边界。
            sort: file
            paths:
              - C&C++/stl/
