groups:
  - slug: computer-basics
    title: 计算机基础
    subtitle: 系统、网络、算法
    lead: 从机器如何运行，到程序如何被调度，再到网络如何把请求送到远方。
    sections:
      - computerorganization
      - algorithm
      - internet
      - linux
    lanes:
      - title: 系统底层
        slug: systems
        summary: 计算机组成、操作系统、进程线程、内存与 I/O。
        modules:
          - title: 组成原理与操作系统
            summary: CPU、进程、线程、内存、磁盘这些不常露面但始终在场的东西。
            sections:
              - computerorganization
          - title: Linux 与 I/O
            summary: 权限、文件描述符、多路复用、性能观察。
            sections:
              - linux
      - title: 算法能力
        slug: algorithms
        summary: 数据结构、排序、查找、字符串与常见题型。
        modules:
          - title: 数据结构与算法
            summary: 用尽量稳定的套路处理不太稳定的问题。
            sections:
              - algorithm
      - title: 网络基础
        slug: network
        summary: DNS、TCP、HTTPS、代理、跨域与浏览器请求行为。
        modules:
          - title: 互联网协议
            summary: 从点击链接到服务返回之间发生的那些事。
            sections:
              - internet

  - slug: java-stack
    title: Java
    subtitle: 语言、虚拟机、框架
    lead: Java 基础、JVM、并发、Spring 生态和持久层框架放在一起看，脉络会清楚得多。
    sections:
      - java
      - jvm
      - juc
      - spring
      - mybatis
      - thirdpartylibraries
    lanes:
      - title: Java 基础
        slug: language
        summary: 类型、集合、异常、反射、IO、NIO 与常用 API。
        modules:
          - title: 语言机制与设计思想
            summary: 语言特性和标准库，写业务代码之前最好先把它们看顺眼。
            sections:
              - java
      - title: 运行时与并发
        slug: runtime-concurrency
        summary: JVM 内存、类加载、GC、锁、线程池与并发工具。
        modules:
          - title: JVM
            summary: 对象、类加载、GC、调优，都是运行时给出的答案。
            sections:
              - jvm
          - title: JUC 并发
            summary: 线程协作、锁、AQS、线程池和异步编排。
            sections:
              - juc
      - title: Spring 生态
        slug: spring-ecosystem
        summary: 从 IoC、AOP、MVC 到 Boot、Security、Gateway、持久层和常用三方库。
        modules:
          - title: Spring Framework
            summary: 容器、Web、事务、安全和扩展点。
            sections:
              - spring
          - title: MyBatis
            summary: SQL 映射、分页、事务、插件和 MyBatis-Plus。
            sections:
              - mybatis
          - title: Java 常用三方库
            summary: Shiro、Jackson、Flowable、XXL-JOB、POI、验证码等工程组件。
            sections:
              - thirdpartylibraries

  - slug: data-store-search
    title: 数据存储与检索
    subtitle: MySQL、Redis、ES、OSS
    lead: 把持久化、缓存、索引和数据同步放在同一个入口里，才像一条完整的数据链路。
    sections:
      - mysql
      - redis
      - elasticsearch
      - oss
    lanes:
      - title: 关系型数据库
        slug: relational-database
        summary: SQL、事务、索引、锁、复制和表结构设计。
        modules:
          - title: MySQL
            summary: 从执行顺序到事务边界，再到索引结构和主从复制。
            sections:
              - mysql
      - title: 缓存系统
        slug: cache
        summary: Redis 数据结构、高可用、复制与常见使用方式。
        modules:
          - title: Redis
            summary: 缓存并不是把数据塞进去就完事，它也有自己的秩序。
            sections:
              - redis
      - title: 搜索、同步与文件
        slug: search-sync
        summary: Elasticsearch 查询、数据同步、文件服务和对象存储。
        modules:
          - title: Elasticsearch
            summary: 检索、聚合、同义词、同步方案和并发问题。
            sections:
              - elasticsearch
          - title: OSS 与文件存储
            summary: MinIO、对象存储、文件访问路径和上传下载链路。
            sections:
              - oss

  - slug: distributed-systems
    title: 分布式架构
    subtitle: 微服务、治理、配置
    lead: 服务拆开以后，真正的问题才刚刚开始。这里放注册配置、熔断降级、事务和系统边界。
    sections:
      - microservices
      - nacos
      - sentinel
    lanes:
      - title: 微服务设计
        slug: microservice-design
        summary: 服务边界、事务一致性、发件箱模式和哈希分布。
        modules:
          - title: 微服务与分布式事务
            summary: 一致性、降级、Outbox、Seata 这些绕不开的工程问题。
            sections:
              - microservices
      - title: 服务治理
        slug: service-governance
        summary: 注册发现、配置中心、灰度、标签路由与控制台运维。
        modules:
          - title: Nacos
            summary: 注册中心、配置中心、Tag 和一致性协议。
            sections:
              - nacos
      - title: 稳定性建设
        slug: stability
        summary: 限流、熔断、降级和系统在压力下的自我保护。
        modules:
          - title: Sentinel
            summary: 把失败限制在合理范围内，也是一种温柔。
            sections:
              - sentinel

  - slug: ai-engineering
    title: AI 工程
    subtitle: RAG、Agent、LangGraph
    lead: RAG 系统、Agent 工程、模型调用基础设施和评测链路放在一起看，才不会把 AI 应用误会成几个接口调用。
    sections:
      - agent
    lanes:
      - title: RAG 与 Agent
        slug: rag-agent
        summary: 从 RAG 基础、知识库建设、模型调度、问答链路到评测和面试表达。
        modules:
          - title: RAG 与 Agentic AI 工程课程
            summary: 按课程章节组织的系列文章。
            intro:
              title: 课程导读
              path: Agent/ai-course/README.md
            tabs:
              - title: RAG 基础
                path: Agent/ai-course/01-rag-basics/
              - title: 知识库建设
                path: Agent/ai-course/02-knowledge-base/
              - title: 模型调度
                path: Agent/ai-course/03-model-infra/
              - title: 知识问答
                path: Agent/ai-course/04-ai-qa/
              - title: RAG 评测
                path: Agent/ai-course/05-rag-evaluation/
              - title: 面试考点
                path: Agent/ai-course/06-interview/
          - title: LangChain 与 LangGraph
            summary: LangChain、LangGraph、LangSmith、CLI、Server 和 Prompt 工程相关笔记。
            paths:
              - Agent/
            excludePaths:
              - Agent/ai-course/

  - slug: random-thoughts
    title: 随笔杂谈
    subtitle: 项目、方案、零散问题
    lead: 零散并不等于无序，只是它们暂时还没有被命名成体系。
    sections:
      - randomthoughts
      - systemarchitecture
      - middleware
    lanes:
      - title: 零散问题
        slug: fragmented-questions
        summary: 日常项目经验、方案设计、工程问题和一些临时想法。
        modules:
          - title: 胡思乱想
            summary: 随便想点什么。
            sections:
              - randomthoughts
          - title: 系统架构
            summary: 生活中常见的系统，它的架构是什么样的
            sections:
              - systemarchitecture
      - title: 中间件
        slug: middleware
        summary: 常用中间件、网关代理、同步组件和文件服务。
        modules:
          - title: 通用中间件
            summary: Canal、Nginx、FTP 等基础设施组件。
            sections:
              - middleware

  - slug: frontend
    title: 前端知识
    subtitle: JS/TS、HTML/CSS、Vue
    lead: 前端并不只是页面样式，它还包括语言、构建、状态、接口、跨端和工程协作。把这些内容独立出来，学习路径会清楚很多。
    sections:
      - jsandts
      - htmlandcss
      - vue
    lanes:
      - title: JS/TS 与构建工具
        slug: language-build
        summary: JavaScript、TypeScript、Node.js、npm 和现代前端工具链。
        modules:
          - title: JS/TS 语言基础
            summary: 变量、函数、对象、异步、模块化、类型系统和泛型。
            sections:
              - jsandts
      - title: HTML 和 CSS
        slug: html-css
        summary: 页面结构、布局、样式系统、移动端适配和跨端样式基础。
        modules:
          - title: 页面结构与样式
            summary: HTML 结构、盒模型、Flex、Grid、滚动容器、图片和 CSS 变量。
            sections:
              - htmlandcss
      - title: Vue 与 uni-app
        slug: vue-uniapp
        summary: Vue 3、组合式 API、Pinia、uni-app 和真实项目工程实践。
        modules:
          - title: Vue 工程实践
            summary: 组件、响应式、页面配置、接口封装、状态管理和构建校验。
            sections:
              - vue

  - slug: mq
    title: 消息队列
    subtitle: MQ、RocketMQ、事件驱动
    lead: 消息队列适合放削峰、异步解耦、延迟处理、重试和事件驱动相关内容，单独成类会比塞在随笔里清楚得多。
    sections:
      - mq
    lanes:
      - title: RocketMQ
        slug: rocketmq
        summary: RocketMQ 消息模型、生产消费、重试、死信队列和 Spring 集成。
        modules:
          - title: RocketMQ
            summary: 生产者、消费者、消息类型、重试、死信队列和 Spring 集成。
            sections:
              - mq

  - slug: python
    title: Python
