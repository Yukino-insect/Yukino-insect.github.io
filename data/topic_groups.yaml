            tabs:
              - title: 模型调度
                path: Agent/01-rag-agent-engineering-course/03-model-routing/
              - title: 知识问答
                path: Agent/01-rag-agent-engineering-course/04-ai-qa-workflow/
              - title: Java Agent 框架实战
                path: Agent/01-rag-agent-engineering-course/07-java-agent-runtime/
          - title: RAG 工程面试要点
            summary: 用框架选择、语言选型和存储方案比较，检验是否理解系统的取舍。
            sort: file
            paths:
              - Agent/01-rag-agent-engineering-course/06-rag-engineering-interview/
      - title: Agent 框架与协作
        slug: agent-tooling
        summary: 用 LangChain、LangGraph 与可复用的 Agent 能力组织多步骤工作流。
        modules:
          - title: LangChain 与 Prompt 工程
            summary: LangChain 的模型、消息、工具与 Agent 抽象，以及 Prompt、MCP 的工程化使用。
            paths:
              - Agent/04-agent-framework-ecosystem/01-langchain-and-prompt/
          - title: LangGraph 工作流与运行时
            summary: 图工作流、状态、子图、可视化调试与服务化部署。
            paths:
              - Agent/04-agent-framework-ecosystem/02-langgraph-workflows/
          - title: Agent 工具与可观测性
            summary: LangCLI、LangSmith 的命令行工作流、追踪、调试、评测与生产监控。
            paths:
              - Agent/04-agent-framework-ecosystem/03-tooling-and-observability/
          - title: Agent 工程基础
            summary: 从 Prompt、项目指令与可复用工作流，到外部工具连接、能力分发和多智能体编排，建立清晰的职责边界。
            paths:
              - Agent/03-agent-engineering-fundamentals/
      - title: 模型训练与推理
        slug: model-development
        summary: 用数据、梯度和模型服务把训练概念连接到可部署的推理链路。
        modules:
          - title: PyTorch 与图像深度学习：从基础到项目推理
            summary: 从数据、梯度与训练循环入门，结合 CleanCanvas Studio 的 LaMa、Manga 和 Real-ESRGAN 代码理解图像张量、权重、设备、FP16、卷积与分块推理。
            sort: file
            paths:
              - Agent/02-model-inference-and-infrastructure/01-pytorch-foundations
          - title: 深度学习、模型推理与重排序
            summary: Transformer、PyTorch、CPU/GPU、FP16、FastAPI 与 BGE Reranker 的独立模型服务实践。
            sort: file
            paths:
              - Agent/02-model-inference-and-infrastructure/02-model-inference-and-rerank/
      - title: 文档智能与运行治理
        slug: document-operations
        summary: 让文档解析服务可用、可观测、可持续运行，而不是只在演示时成功。
        modules:
          - title: 文档智能与 OCR
            summary: OCR、版面分析、结构化文档资产、异步任务与解析服务部署。
