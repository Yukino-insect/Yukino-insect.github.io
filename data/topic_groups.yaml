groups:
  - slug: computer-basics
    title: 计算机基础
    subtitle: 系统、网络、算法
    lead: 从机器如何运行，到程序如何被调度，再到网络如何把请求送到远方。
    sections:
      - computerorganization
      - algorithm
      - internet
      - linux
      - assembly
      - docker
    lanes:
      - title: 系统底层
        slug: systems
        summary: 计算机组成、操作系统、进程线程、内存与 I/O。
        modules:
          - title: 数据表示与校验编码
            summary: 进制、补码、字符编码，以及奇偶校验、汉明码、CRC 和 ECC 的工作边界。
            paths:
              - ComputerOrganization/01-data-representation/
          - title: CPU、总线与主存
            summary: 时钟周期、地址总线、Cache、物理地址、RAM/ROM 与 CPU 的基本运行方式。
            paths:
              - ComputerOrganization/02-cpu-memory/
          - title: 操作系统的内存、文件与 I/O 课程
            summary: 从虚拟地址、页表和物理页出发，依次理解文件偏移、块设备、页缓存、mmap、写回与程序装载；按编号连续阅读。
            sort: file
            paths:
              - ComputerOrganization/os-memory-file-io-course/
          - title: 操作系统机制专题
            summary: 在主课程之外，进一步讨论用户态与内核态、进程线程、中断、设备队列、内存分配与输入系统等独立机制。
            paths:
              - ComputerOrganization/03-operating-systems/
          - title: 文件、程序与持久化专题
            summary: 补充磁盘空闲空间、可靠写入、ELF 与汇编源文件等内容；与主课程中的基础链路相互参照，不替代其阅读顺序。
            paths:
              - ComputerOrganization/04-files-and-programs/
          - title: 数据表示与文本处理课程
            summary: 从比特、语言数据类型和数字编码，到 Unicode、UTF-8 与文件、网络、数据库之间的文本边界。
            sort: file
            paths:
              - ComputerOrganization/data-representation-course/
          - title: Linux 与 I/O
            summary: 权限、文件描述符、多路复用、性能观察。
            sections:
              - linux
      - title: 工程环境与启动链路
        slug: platform-engineering
        summary: 容器如何交付应用，以及程序如何从内核启动到第一行 C 代码。
        modules:
          - title: Docker 容器技术教程
            summary: 从容器、镜像与 Compose 入门，到网络存储、构建优化、底层隔离和工程化运维。
            sort: file
            paths:
              - Docker/docker-course/
          - title: RISC-V 汇编基础
            summary: CPU 如何执行指令、寄存器和最小程序，以及标签、伪指令、段和汇编方言。
            sort: file
            paths:
              - Assembly/01-riscv-and-assembly-basics/
          - title: 启动环境、栈与链接
            summary: 调用约定、栈帧、QEMU、链接脚本和特权级如何共同准备内核启动环境。
            sort: file
            paths:
              - Assembly/02-boot-and-linking/
          - title: 特权级、页表与 CSR
            summary: RISC-V 的 M/S/U 特权级、trap、Sv39 页表、TLB、CSR 和内存顺序。
            sort: file
            paths:
              - Assembly/03-privilege-and-memory/
          - title: xv6 早期启动
            summary: 从 entry.S 设置栈，到第一张页表和 riscv.h 中的底层系统接口。
            sort: file
            paths:
              - Assembly/04-xv6-startup/
      - title: 算法能力
        slug: algorithms
        summary: 大学算法设计、考研数据结构、排序、查找、字符串与常见题型。
        modules:
          - title: 大学算法设计与考研数据结构
            summary: 从复杂度分析和线性结构出发，系统学习树、图、查找、排序及分治、贪心、动态规划、回溯；每章均给出可直接编译运行的 C++ 程序与复杂度推导。
            intro:
              title: 课程导读
              path: Algorithm/university-algorithms-course/README.md
            tabs:
              - title: 分析基础
                path: Algorithm/university-algorithms-course/01-foundation/
              - title: 排序与设计方法
                path: Algorithm/university-algorithms-course/02-design/
              - title: 考研数据结构
                path: Algorithm/考研数据结构/
          - title: 线性结构、查找与字符串
            summary: 二分、链表、滑动窗口、LRU、字符串转换与 KMP 等基础题型。
            paths:
              - Algorithm/01-linear-and-strings/
          - title: 树与二叉树
            summary: 树的基本概念、平衡判断、右视图与二叉搜索树的第 k 大问题。
            paths:
              - Algorithm/02-trees/
          - title: 排序与选择
            summary: 快速排序、归并排序、堆排序，以及借助分区寻找第 k 大元素。
            paths:
              - Algorithm/03-sorting-and-selection/
          - title: 动态规划与回溯
            summary: 用零钱兑换和复原 IP 地址理解状态转移与搜索分支。
            paths:
              - Algorithm/04-dynamic-and-backtracking/
      - title: 网络基础
        slug: network
        summary: DNS、TCP、HTTPS、代理、跨域与浏览器请求行为。
        modules:
          - title: 网络分层与 TCP 基础
            summary: 网络分层、子网掩码、TCP 报文与连接建立/关闭的基本机制。
            paths:
              - Internet/01-network-foundations/
          - title: HTTP、HTTPS 与浏览器行为
            summary: 跨域、协议升级、请求超时，以及快速点击链接时浏览器如何处理导航。
            paths:
              - Internet/02-http-and-browser/
          - title: DNS、代理与连通性
            summary: 域名解析、系统代理、内网穿透和 SSH 组成的访问链路。
            paths:
              - Internet/03-dns-proxy-and-connectivity/
          - title: 网络安全与运维设备
            summary: 证书、令牌认证和防火墙设备在网络边界中的职责。
            paths:
              - Internet/04-security-and-operations/

  - slug: java-stack
    title: Java
    subtitle: 语言、虚拟机、框架
    lead: Java 基础、JVM、并发、Spring 生态和持久层框架放在一起看，脉络会清楚得多。
    sections:
      - java
      - jvm
      - juc
      - spring
      - mybatis
      - thirdpartylibraries
      - android
    lanes:
      - title: Java 基础
        slug: language
        summary: 类型、集合、异常、反射、IO、NIO 与常用 API。
        modules:
          - title: 语言基础与对象模型
            summary: 基本类型、对象、构造器、接口、枚举、字符串、值传递和表达式。
            paths:
              - Java/01-language-object-model/
          - title: 集合与函数式处理
            summary: 集合、优先队列、比较器、Fail-Fast、数组性能与 Stream 的执行边界。
            paths:
              - Java/02-collections-and-functional/
          - title: 异常、反射与设计模式
            summary: 异常的成本和捕获机制、反射，以及常见面向对象设计模式。
            paths:
              - Java/03-exceptions-reflection-design/
          - title: I/O、NIO 与网络编程
            summary: 文件、流、Channel/Buffer/Selector、URL、Socket 与 Netty 的线程分工。
            paths:
              - Java/04-io-and-networking/
      - title: Android 开发
        slug: android
        summary: 面向有 Java 基础的初学者，从项目结构和 UI 对象树进入资源、Activity、事件、布局与 APK 构建。
        modules:
          - title: Android 开发从零入门课程
            summary: 使用 Java 与传统 View/XML 建立完整 Android 心智模型，再完成一个可运行的待办清单应用。
            sort: file
            paths:
              - Android/android-course/
      - title: 运行时与并发
        slug: runtime-concurrency
        summary: JVM 内存、类加载、GC、锁、线程池与并发工具。
        modules:
          - title: JVM
            summary: 对象、类加载、GC、调优，都是运行时给出的答案。
            sections:
              - jvm
          - title: 线程生命周期与内存可见性
            summary: 进程线程、线程创建与通信、CAS、volatile 和 ThreadLocal 的边界。
            paths:
              - JUC/01-threads-and-memory/
          - title: 锁、AQS 与同步器
            summary: synchronized、显式锁、AQS、读写锁、信号量、死锁与同步协调。
            paths:
              - JUC/02-locks-and-aqs/
          - title: 并发容器与协作工具
            summary: BlockingQueue、DelayQueue、CountDownLatch 和 CyclicBarrier 的使用场景。
            paths:
              - JUC/03-coordination-and-containers/
          - title: 线程池与异步编排
            summary: ThreadPoolExecutor、关闭与异常处理，以及 CompletableFuture 的任务组合。
            paths:
              - JUC/04-executors-and-futures/
      - title: Spring 生态
        slug: spring-ecosystem
        summary: 从 IoC、AOP、MVC 到 Boot、Security、Gateway、持久层和常用三方库。
        modules:
          - title: Spring 核心容器与 Boot
            summary: IoC、事件、扩展点、配置、自动装配、组件扫描与 Starter 的启动链路。
            paths:
              - Spring/01-core-and-boot/
          - title: Web MVC 与响应式编程
            summary: MVC、参数绑定、校验、上传、跨域、SSE、WebFlux 与异步请求边界。
            paths:
              - Spring/02-web-and-reactive/
          - title: AOP、缓存与事务
            summary: 横切逻辑、缓存、声明式事务和编程式事务如何共同组织业务一致性。
            paths:
              - Spring/03-data-and-transactions/
          - title: Security 与 Gateway
            summary: 方法授权、安全框架与网关在服务入口处的职责划分。
            paths:
              - Spring/04-security-and-gateway/
          - title: 测试、日志与工程结构
            summary: 单元/集成测试、日志、多模块工程、依赖打包与内嵌 Tomcat 的运行边界。
            paths:
              - Spring/05-testing-and-engineering/
          - title: MyBatis
            summary: SQL 映射、分页、事务、插件和 MyBatis-Plus。
            sections:
              - mybatis
          - title: Java 常用三方库
            summary: Shiro、Jackson、Flowable、XXL-JOB、POI、验证码等工程组件。
            sections:
              - thirdpartylibraries

  - slug: data-store-search
    title: 数据存储与检索
    subtitle: 关系库、缓存、检索、对象与分析
    lead: 把持久化、缓存、检索、对象存储与分析系统放在同一个入口里，数据链路才不会只剩产品名。
    sections:
      - mysql
      - redis
      - elasticsearch
      - oss
      - sqlite
    lanes:
      - title: 关系型数据库
        slug: relational-database
        summary: SQL、事务、索引、锁、复制和表结构设计。
        modules:
          - title: SQL、查询与视图
            summary: SQL 执行顺序、连接、递归、排序、IN 条件、视图及常用查询特性。
            paths:
              - Mysql/01-sql-and-query/
          - title: 表结构、主键与索引
            summary: Schema 模式、自增主键和索引如何影响数据模型与查询代价。
            paths:
              - Mysql/02-schema-and-indexes/
          - title: 事务、锁与一致性
            summary: 事务边界、FOR UPDATE 与多数据源下的一致性问题。
            paths:
              - Mysql/03-transactions-and-locks/
          - title: 复制与运维
            summary: MySQL 主从复制的角色、数据同步与日常运维关注点。
            paths:
              - Mysql/04-replication-and-operations/
          - title: SQLite
            summary: 认识嵌入式数据库 SQLite 
            sections:
              - sqlite
      - title: 缓存系统
        slug: cache
        summary: Redis 数据结构、高可用、复制与常见使用方式。
        modules:
          - title: Redis
            summary: 缓存并不是把数据塞进去就完事，它也有自己的秩序。
            sections:
              - redis
      - title: 搜索与知识检索
        slug: search-retrieval
        summary: 全文检索、向量检索与图检索分别如何找到需要的数据。
        modules:
          - title: Elasticsearch 基础、集群与存储
            summary: 索引、集群、内部数据组织和学习导读，先建立检索系统的整体视图。
            paths:
              - Elasticsearch/01-foundations-and-storage/
          - title: 查询、聚合与搜索提示
            summary: 查询 DSL、聚合和搜索提示词如何把用户意图转成检索请求。
            paths:
              - Elasticsearch/02-query-and-aggregation/
          - title: 相关性、多语言与相似检索
            summary: 同义词、国际化分析和相似性搜索分别解决哪些召回与匹配问题。
            paths:
              - Elasticsearch/03-relevance-and-language/
          - title: 客户端、同步与并发
            summary: Java 客户端、Binlog/双写同步，以及并发更新中的一致性处理。
            paths:
              - Elasticsearch/04-integration-and-sync/
          - title: 向量数据库与向量检索
            summary: Embedding、ANN、pgvector 与 Milvus 的数据模型、索引参数、压测、迁移与恢复。
            sort: file
            paths:
              - VectorDB/vector-database-course/
          - title: 图数据库、知识图谱与图检索
            summary: Neo4j、Cypher、APOC、GDS、数据摄取、备份恢复；GraphRAG 仅作为一项应用。
            sort: file
            paths:
              - GraphDB/graph-database-course/
      - title: 对象与分析存储
        slug: object-analytics
        summary: 面向文件、对象和海量分析数据的存储模型、接口与运维方式。
        modules:
          - title: OSS 与文件存储
            summary: MinIO、对象存储、文件访问路径和上传下载链路。
            paths:
              - OSS/
            excludePaths:
              - OSS/object-storage-course/
          - title: RustFS、MinIO 与 S3 对象存储实战
            summary: 从对象模型和请求签名，到分片上传、预签名、生命周期、备份恢复与故障排查。
            sort: file
            paths:
              - OSS/object-storage-course/
          - title: ClickHouse 列式分析数据库
            summary: MergeTree、排序键、分区、批量摄入、系统表、TTL、备份与恢复。
            sort: file
            paths:
              - ClickHouse/clickhouse-course/

  - slug: distributed-systems
    title: 分布式架构
    subtitle: 微服务、治理、协调
    lead: 服务拆开以后，真正的问题才刚刚开始。这里放注册配置、协调一致性、熔断降级、事务和系统边界。
    sections:
      - microservices
      - nacos
      - sentinel
    lanes:
      - title: 微服务设计
        slug: microservice-design
        summary: 服务边界、事务一致性、发件箱模式和哈希分布。
        modules:
          - title: 服务架构与调用
            summary: 微服务边界、一致性哈希、Feign/OpenFeign 和基于 Header 的灰度发布。
            paths:
              - Microservices/01-architecture-and-communication/
          - title: 一致性与分布式事务
            summary: 发件箱、分布式日志存储与 Seata 如何处理跨服务的数据一致性。
            paths:
              - Microservices/02-consistency-and-data/
          - title: 韧性与可观测性
            summary: 熔断降级和 SkyWalking 帮助系统在故障与压力下保持可理解、可恢复。
            paths:
              - Microservices/03-resilience-and-observability/
      - title: 服务治理与协调
        slug: service-governance
        summary: 注册发现、配置中心、协调元数据、灰度、标签路由与控制台运维。
        modules:
          - title: Nacos
            summary: 注册中心、配置中心、Tag 和一致性协议。
            sections:
              - nacos
          - title: etcd 分布式协调服务
            summary: Raft、MVCC revision、watch、lease、事务、选主、压缩、快照和灾难恢复。
            sort: file
            paths:
              - Microservices/etcd-course/
      - title: 稳定性建设
        slug: stability
        summary: 限流、熔断、降级和系统在压力下的自我保护。
        modules:
          - title: Sentinel
            summary: 把失败限制在合理范围内，也是一种温柔。
            sections:
              - sentinel

  - slug: ai-engineering
    title: AI 工程
    subtitle: RAG、Agent、模型与中间件
    lead: RAG、Agent、模型服务与数据中间件各有自己的运行规律；既要能组合成应用，也不能把它们误会成几个接口调用。
    sections:
      - agent
    lanes:
      - title: RAG 与知识库
        slug: rag-knowledge
        summary: 从检索增强生成的基本链路，到知识库构建、评测与改进。
        modules:
          - title: RAG 工程课程
            summary: 以检索、知识库和评测为主线，建立可验证的 RAG 闭环。
