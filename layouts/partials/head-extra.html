<link rel="stylesheet" href="/css/chroma-silent.css">
<link rel="icon" href="{{ "favicon.ico" | relURL }}">
{{ if .Params.math }}
<script>
  MathJax = {
    tex: {
      inlineMath: { '[+]': [['$', '$']] },
      displayMath: { '[+]': [['$$', '$$']] },
      processEscapes: true
    }
  };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-chtml.js"></script>
{{ end }}
